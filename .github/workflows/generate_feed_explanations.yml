name: Cloud Verse Explanation Generator

on:
  workflow_dispatch:
    inputs:
      max_minutes:
        description: 'Maximum runtime in minutes (e.g. 60, 120, 300)'
        required: false
        default: '300'
      max_verses:
        description: 'Maximum verses to generate (0 for unlimited)'
        required: false
        default: '0'
  schedule:
    # Runs automatically every 3 hours as backup insurance
    - cron: '0 */3 * * *'

concurrency:
  group: verse-explanation-generator
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run Cloud Explanations Generator
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: |
          MAX_MINS="${{ github.event.inputs.max_minutes || '300' }}"
          MAX_COUNT="${{ github.event.inputs.max_verses || '0' }}"
          python scripts/generate_feed_explanations.py --max-minutes "$MAX_MINS" --max-count "$MAX_COUNT"

      - name: Check Progress Status
        if: always()
        run: |
          python scripts/check_progress.py

      - name: Commit and Push New Explanations
        if: always()
        run: |
          python scripts/cloud_merge_and_push.py

      - name: Trigger Next Run (Continuous Relay)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -f ".all_completed" ]; then
            echo "All scriptures 100% completed! Continuous relay finished."
          else
            echo "Triggering next continuous relay run..."
            gh workflow run generate_feed_explanations.yml --ref main || echo "Continuous dispatch queued or skipped."
          fi

